<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} &mdash; {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
  <div class="terminal">
    {{ partial "header.html" . }}
    <main>
      {{ block "main" . }}{{ .Content }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
